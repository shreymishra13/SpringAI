spring.application.name=mcpClient

#Personalized Log visualizer & Saving logs in log/ directory

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.file.name=logs/application.log

#Setting up Local LLM (Ollama)

spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.model=codellama
spring.ai.ollama.chat.options.model=qwen2.5:7b
#spring.ai.ollama.embedding.model=nomic-embed-text

#MCP configuration
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json


