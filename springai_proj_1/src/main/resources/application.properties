spring.application.name=springai_proj_1

spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.model=codellama
spring.ai.ollama.chat.options.model=qwen2.5:7b

# Embedding model
spring.ai.ollama.embedding.model=nomic-embed-text

#spring.ai.ollama.chat.temperature=0.7

logging.file.name=logs/application.log

logging.level.root=INFO

logging.level.com.springai=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.ai.chat.memory.repository.jdbc.initialize-schema=always


# PostgreSQL Configuration

spring.datasource.url=jdbc:postgresql://localhost:5432/springai_db
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2


spring.docker.compose.stop.command=down

spring.ai.vectorstore.qdrant.initiliaze-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=memory


