services:
  qdrant:
    image: 'qdrant/qdrant:latest'
    ports:
      - '6333:6333'
      - '6334:6334'

  postgres:
    image: postgres:17
    container_name: springai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: springai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - '5432:5432'
    volumes:
      - springai-postgres-data:/var/lib/postgresql/data

volumes:
  springai-postgres-data: